url: https://cefet-rj-dal.github.io/heimdall/

template:
  bootstrap: 5

reference:
  - title: Error-based detectors
    desc: Detectors that monitor the residuals of a predictive model (real concept drift).
    contents:
      - dfr_cusum
      - dfr_ddm
      - dfr_ecdd
      - dfr_eddm
      - dfr_hddm
  - title: Distribution-based detectors
    desc: Detectors that monitor the distribution of the observed features (virtual concept drift).
    contents:
      - dfr_adwin
      - dfr_kswin
      - dfr_lbdd
      - dfr_mcdd
      - dfr_onlinebcp
      - online_bcp
      - dfr_page_hinkley
  - title: Multivariate and combined detectors
    contents:
      - dfr_aedd
      - dfr_kldist
      - dfr_multi_criteria
      - dfr_ensemble
      - ensemble_vote
      - dfr_proton
      - dfr_qts
  - title: Batch-wise multimodal change detection
    desc: Multimodal QuantTree (Stucchi et al., 2023).
    contents:
      - mmqt
      - mmqt_test
      - dfr_mmqt
  - title: Histogram two-sample tests
    desc: Equal intensity k-means space partitioning (Liu et al., 2021).
    contents:
      - eikmeans
      - eikmeans_test
      - dfr_eikmeans
  - title: Population Stability Index
    desc: PSI on quantile bins of a baseline (Kurian and Allali, 2024).
    contents:
      - psi
      - dfr_psi
  - title: Maximum Concept Discrepancy
    desc: Unsupervised detector with a contrastively trained set encoder (Wan et al., 2024).
    contents:
      - dfr_mcd
  - title: Supervised change point detection (InDiD)
    desc: Sequence-to-sequence detector trained with the InDiD loss (Romanenkova et al., 2022).
    contents:
      - indid
      - indid_predict
      - dfr_indid
  - title: Bayesian network log-likelihood ratio (LLR2)
    desc: Fully unsupervised detector with a semiparametric Bayesian network (Sojo et al., 2027).
    contents:
      - spbn
      - spbn_loglik
      - dfr_llr2
  - title: Feature drift with the domino drift effect
    desc: Predicts which unmonitored features drift from their correlation with the drifting monitored ones (Szűcs and Németh, 2025).
    contents:
      - dfr_dde
      - dde_curve
      - dde_score
      - dde_feature_drift
  - title: Baselines
    contents:
      - dummy
      - dfr_inactive
      - dfr_passive
  - title: Adaptive models
    contents:
      - stealthy
  - title: Metrics
    contents:
      - metric
      - mt_accuracy
      - mt_precision
      - mt_recall
      - mt_fscore
      - mt_rocauc
  - title: Normalization
    contents:
      - nrm_base
      - nrm_memory
  - title: Class hierarchy and generics
    contents:
      - drifter
      - error_based
      - dist_based
      - mv_dist_based
      - fit.drifter
      - update_state
      - reset_state
  - title: Data
    contents:
      - st_drift_examples
  - title: Benchmark streams with controlled drift
    desc: Realistic streams with verified real and virtual drift (Hinder et al., 2026).
    contents:
      - dsg_source
      - dsg_source_data
      - dsg_source_regions
      - dsg_synthetic
      - dsg_take
      - dsg_drift
      - dsg_stream
      - dsg_mmd_test
